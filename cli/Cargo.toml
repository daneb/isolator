[package]
name = "moor"
version = "0.1.0"
edition = "2021"
description = "Control CLI for containerized, keel-driven AI development sandboxes"
license = "MIT"
repository = "https://github.com/daneb/moor"

[[bin]]
name = "moor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
