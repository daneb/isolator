# hadolint config — lints every Dockerfile under images/ and proxy/ in CI
# (see .github/workflows/ci.yml). Real problems it found were fixed in the
# Dockerfiles themselves (DL4006 missing `pipefail` on curl-pipe-to-shell
# installs, DL3046 useradd without -l). The rules below are deliberately
# ignored, not silently missed — each one would fight a choice this
# project already made on purpose.
ignored:
  - DL3006 # "always tag the version of an image explicitly" — a known
           # hadolint limitation with `FROM ${ARG}`: it can't statically
           # verify a value that only exists via an ARG default, even
           # though every one of these does carry an explicit tag
           # (`ARG BASE_IMAGE=moor/base:latest` in images/node,
           # images/python, images/rust — see images/build.sh, which
           # always passes --build-arg BASE_IMAGE=moor/base:latest
           # explicitly too).
  - DL3008 # pin apt package versions — debian:bookworm-slim's own rolling
           # security patches are what we want; a version pin freezes a
           # known-vulnerable package instead of tracking upstream's fix.
           # Trivy's image CVE scan in CI is what actually gates on real
           # vulnerabilities, not a frozen apt version.
  - DL3016 # pin npm package versions — @anthropic-ai/claude-code installs
           # unpinned on purpose (see docs/decisions/0002-claude-code-authentication.md:
           # no auth material baked in, and no moor-pinned CLI version
           # either — every project always gets the current `claude`).
  - DL3013 # pin pip package versions — pipx is a bootstrapping tool, not a
           # runtime dependency of anything moor ships.
  - DL3066 # non-numeric USER — `agent` and `tinyproxy` are real named
           # users created earlier in the same image; numeric-only IDs
           # only help a cross-image UID-mapping scenario this project
           # doesn't have.
